name: Prepare reviewed Supabase backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prepare-reviewed-backend.mjs "$RUNNER_TEMP/imperial-reviewed"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-supabase-backend
          path: ${{ runner.temp }}/imperial-reviewed/
