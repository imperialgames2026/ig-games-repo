name: Verify and deploy reviewed Supabase staging backend
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', 'scripts/prepare-reviewed-backend.mjs', 'scripts/deploy-reviewed-staging.mjs', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Apply reviewed history and functions to Imperial Games staging
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble only reviewed Supabase sources
        run: node scripts/prepare-reviewed-backend.mjs "$RUNNER_TEMP/imperial-backend"
      - name: Preserve reviewable backend package
        uses: actions/upload-artifact@v4
        with:
          name: imperial-reviewed-staging-backend
          path: ${{ runner.temp }}/imperial-backend/
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: imperial-reviewed-staging-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: imperial-reviewed-staging-backend
          path: ${{ runner.temp }}/imperial-backend
      - uses: supabase/setup-cli@v1
        if: inputs.deploy_staging
        with:
          version: 2.121.0
      - name: Reconcile exact hosted history without database passwords
        run: node scripts/deploy-reviewed-staging.mjs
      - name: Apply pending reviewed changes to dedicated staging project
        if: inputs.deploy_staging
        run: |
          node scripts/deploy-reviewed-staging.mjs --apply --functions-file="$RUNNER_TEMP/pending-functions.txt"
          while IFS= read -r function_name; do
            [ -z "$function_name" ] && continue
            supabase functions deploy "$function_name" --workdir "$RUNNER_TEMP/imperial-backend" --project-ref qonqemhljgxlwpghkxhn --use-api
          done < "$RUNNER_TEMP/pending-functions.txt"
