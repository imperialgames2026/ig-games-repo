name: Verify and deploy reviewed Supabase staging backend
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', 'scripts/prepare-reviewed-backend.mjs', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Apply reviewed history and functions to Imperial Games staging
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble only reviewed Supabase sources
        run: node scripts/prepare-reviewed-backend.mjs "$RUNNER_TEMP/imperial-backend"
      - name: Preserve reviewable backend package
        uses: actions/upload-artifact@v4
        with:
          name: imperial-reviewed-staging-backend
          path: ${{ runner.temp }}/imperial-backend/
      - uses: supabase/setup-cli@v1
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
        with:
          version: 2.121.0
      - name: Apply to dedicated staging project
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing repository Actions secret STAGING_SUPABASE_DB_PASSWORD"
            exit 1
          fi
          supabase link --workdir "$RUNNER_TEMP/imperial-backend" --project-ref qonqemhljgxlwpghkxhn
          supabase db push --workdir "$RUNNER_TEMP/imperial-backend" --dry-run
          supabase db push --workdir "$RUNNER_TEMP/imperial-backend" --yes
          supabase functions deploy --workdir "$RUNNER_TEMP/imperial-backend" --project-ref qonqemhljgxlwpghkxhn
