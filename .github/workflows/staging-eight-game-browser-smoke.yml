name: Eight-game desktop and mobile browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/casino-zip, main]
    paths:
      - 'pages/**'
      - 'components/games/**'
      - 'components/admin/TournamentPayoutEditor.jsx'
      - 'App.jsx'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/staging-eight-game-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    # Keep the runner compatible with the locked Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install production-locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build practice-only app
        run: npm run build
        env:
          VITE_ENABLE_LEGACY_EDGE_FUNCTIONS: 'false'
      - name: Browser smoke on desktop and mobile
        run: npx playwright test --config playwright.config.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eight-game-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
