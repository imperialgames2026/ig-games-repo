name: Verify app build

on:
  push:
    branches:
      - migration/supabase-foundation
  pull_request:
    branches:
      - migration/supabase-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        run: npm run build

# CI build verification for the Supabase migration branch.
