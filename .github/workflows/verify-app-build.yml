name: Verify app build

on:
  push:
    branches:
      - migration/supabase-foundation
      - integration/casino-zip
      - main
  pull_request:
    branches:
      - migration/supabase-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (lockfile reconciliation pending)
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        run: npm run build
