name: Verify app build

on:
  push:
    branches:
      - migration/supabase-foundation
      - integration/casino-zip
      - main
  pull_request:
    branches:
      - migration/supabase-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check migration security guards
        run: node --test tests/legacyBackendGuard.test.mjs
      - name: Build Vite app
        run: npm run build
