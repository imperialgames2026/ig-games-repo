name: Verify app build

on:
  push:
    branches:
      - migration/supabase-foundation
  pull_request:
    branches:
      - migration/supabase-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore omitted source files from the repository archive
        run: |
          echo "Archive source preview:"
          mkdir -p /tmp/ig-games-archive
          unzip -oq ig-games.zip -d /tmp/ig-games-archive
          for dir in pages components hooks entities utils api functions lib; do
            if [ -d "/tmp/ig-games-archive/src/$dir" ]; then
              mkdir -p "$dir"
              cp -rn "/tmp/ig-games-archive/src/$dir/." "$dir/"
            fi
          done
      - name: Commit restored source modules
        if: github.event_name != 'pull_request'
        run: |
          git add pages components hooks entities utils api functions lib
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Restore missing React source modules from project archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No missing source modules to commit."
          fi
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        run: npm run build

# CI build verification for the Supabase migration branch.

# The build runs after archive recovery so restored files are verified as part of CI.
