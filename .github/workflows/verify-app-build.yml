name: Verify app build

on:
  push:
    branches:
      - migration/supabase-foundation
      - integration/casino-zip
      - main
  pull_request:
    branches:
      - migration/supabase-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check migration security guards
        run: node --test tests/legacyBackendGuard.test.mjs tests/multiplayerPractice.test.mjs tests/crapsCasinoJoinModes.test.mjs tests/crapsDragDrop.test.mjs tests/practiceFairDice.test.mjs tests/eightMultiplayerGames.security.test.mjs tests/omahaActualEvaluator.test.mjs tests/nlheEightSeat.test.mjs tests/pokerTournamentPresets.test.mjs tests/pokerTournamentPrizes.test.mjs tests/adminCommandCenter.test.mjs tests/globalPlayerWallet.test.mjs
      - name: Audit all game backend routes
        run: node scripts/audit-game-backends.mjs
      - name: Upload route migration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-migration-inventory
          path: game-migration-inventory.json
          if-no-files-found: ignore
      - name: Build Vite app
        run: npm run build
