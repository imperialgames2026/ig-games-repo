name: Android practice debug APK (isolated)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pages/Login.jsx'
      - 'tests/mobileBuildRegression.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'scripts/verify-mobile-bundle.mjs'
      - '.github/workflows/android-practice.yml'
      - 'docs/MOBILE_ANDROID_IMPLEMENTATION.md'
permissions:
  contents: read
jobs:
  web-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://qonqemhljgxlwpghkxhn.supabase.co
      VITE_ENABLE_LEGACY_EDGE_FUNCTIONS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test login syntax and native Auth guard without hosted calls
        run: node --test tests/mobileBuildRegression.test.mjs
      - name: Compile web assets (not a hosted authentication test)
        run: npm run build
  debug-apk:
    needs: web-regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: https://qonqemhljgxlwpghkxhn.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_PRACTICE_SUPABASE_ANON_KEY }}
      VITE_ENABLE_LEGACY_EDGE_FUNCTIONS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Require public practice client configuration
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo 'MOBILE_PRACTICE_SUPABASE_ANON_KEY is missing; refusing to build an unusable placeholder-client APK.' >&2
            exit 1
          fi
      - name: Generate reviewed practice assets
        run: npm run build
      - name: Reject non-practice or mismatched assets
        run: node scripts/verify-mobile-bundle.mjs
      - name: Install temporary Capacitor 8 toolchain (no repo lockfile changes)
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.3 @capacitor/android@8.5.3 @capacitor/cli@8.5.3
      - name: Generate Android debug native project
        run: |
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned-for-release debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Generate artifact metadata
        shell: bash
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-debug.sha256
          cp dist/release.json android-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-games-practice-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug.sha256
            android-release.json
          retention-days: 7
