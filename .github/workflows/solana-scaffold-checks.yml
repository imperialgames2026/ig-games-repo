name: Solana scaffold checks
on:
  push:
    branches: [integration/casino-zip]
    paths:
      - 'solana/**'
      - 'lib/solanaNetwork.js'
      - 'lib/solanaWallet.js'
      - 'components/solana/**'
      - 'pages/SolanaDevnet.jsx'
      - 'tests/solanaWallet.test.mjs'
      - 'tests/solanaNetwork.test.mjs'
      - '.github/workflows/solana-scaffold-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.23.4 <23'
      - run: node --test tests/solanaNetwork.test.mjs tests/solanaWallet.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  anchor-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path solana/Cargo.toml
